# Sysbuild builds several images together. This adds MCUboot as a second image
# that runs first at reset, checks the app's signature, and then starts it.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Signature type (also the NCS default on the nRF52840). For now the image is
# signed with MCUboot's public demo key (root-ec-p256.pem): our own key comes later.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
