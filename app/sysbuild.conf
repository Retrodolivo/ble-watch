# Sysbuild builds several images together. This adds MCUboot as a second image
# that runs first at reset, checks the app's signature, and then starts it.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Signature type (also the NCS default on the nRF52840). The image is signed
# with MCUboot's public demo key (root-ec-p256.pem); Step 4b replaces it with our own key.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
