# Extra Kconfig for debugging with GDB. Use it on top of prj.conf:
#   west build -b nrf52840dk/nrf52840 app -p -- -DEXTRA_CONF_FILE=debug.conf

# -Og instead of -Os: code follows the source, variables stay visible
CONFIG_DEBUG_OPTIMIZATIONS=y

# Let the debugger see Zephyr threads, with their names
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_THREAD_NAME=y

# Stop on a failed __ASSERT() instead of running with bad state
CONFIG_ASSERT=y
