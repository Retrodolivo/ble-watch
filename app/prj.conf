# LED control through the GPIO driver
CONFIG_GPIO=y

# Logging, printed on the UART console (DK's USB serial, 115200 baud)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Display subsystem; the SSD16xx driver is enabled by the shield's devicetree node
CONFIG_DISPLAY=y

# Bluetooth LE peripheral (NCS uses Nordic's SoftDevice Controller as the link layer)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ble-watch"

# Zephyr's Current Time Service (0x1805); our callbacks are in src/ble.c
CONFIG_BT_CTS=y

# Firmware updates over BLE: MCUmgr with the SMP service, the BT transport and the
# image group (writes the new image to slot 1). NCS helper option from
# nrf/samples/common/mcumgr_bt_ota_dfu. Used with the nRF Connect Device Manager app.
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y

# Version written in the image header by the signing step; shown in Device Manager.
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.2.0+0"
