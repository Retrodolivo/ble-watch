# GPIO driver (accelerometer interrupt, status LED)
CONFIG_GPIO=y

# LED API for the binary face. The PWM LED driver (and the PWM driver) turn on
# by themselves, because the overlay has "pwm-leds" nodes.
CONFIG_LED=y

# LIS2DW12 accelerometer (node in the overlay). The driver (CONFIG_LIS2DW12)
# and I2C turn on by themselves from the devicetree. We add the sensor API, the
# interrupt (trigger) support handled in the system work queue, and tap events.
CONFIG_SENSOR=y
CONFIG_LIS2DW12_TRIGGER_GLOBAL_THREAD=y
CONFIG_LIS2DW12_TAP=y

# Logging, printed on the UART console (DK's USB serial, 115200 baud)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Bluetooth LE peripheral (NCS uses Nordic's SoftDevice Controller as the link layer)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ble-watch"

# Zephyr's Current Time Service (0x1805); our callbacks are in src/ble.c
CONFIG_BT_CTS=y

# Firmware updates over BLE: MCUmgr with the SMP service, the BT transport and the
# image group (writes the new image to slot 1). NCS helper option from
# nrf/samples/common/mcumgr_bt_ota_dfu. Used with the nRF Connect Device Manager app.
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y

# Version written in the image header by the signing step; shown in Device Manager.
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.1.0+0"
